[project]
name = "happydamsel"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1",
    "pytest-asyncio>=1.3.0",
    "ruff==0.16.8",
    "types-pyyaml>=6.0.12.20209155",
]

[project.scripts]
happydamsel = "damsel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["damsel"]


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Максимальная длина строки (можно сделать как в Black)
line-length = 94
src = ["./damsel"]


[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "damsel"
ignore_missing_imports = true
show_error_codes = true
