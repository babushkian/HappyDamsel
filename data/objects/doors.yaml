# Дверь одна на две локации (hall и closet ссылаются на один id).
# Как она называется с каждой стороны — см. object_overrides в YAML локаций.
closet_door:
  kind: "door"
  name: "Дверь в кладовку"
  description: "Хлипкая дверь, выкрашенная светлой краской. Без замка, с простенькой железной ручкой."
  can_open: true
  can_lock: false
  is_container: false
  locked: false
  open: false
