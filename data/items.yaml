
rusty_key:
  name: "Ржавый ключ"
  description: "Изящный ключик, но видно что он много времени пролежал в сырости."
  consumable: true

gold_ring:
  name: "Золотое кольцо"
  description: "Кольцо сияет как новое."
  consumable: false

note:
  name: "Старая записка"
  descriptions:
    - when:
        - type: flag_set
          flag: note_read
      text: "Сложенная вчетверо записка. Ты помнишь ее наизусть: «Если забить гвоздь в дощечку с тремя сучками, откроется путь на свободу»."
    - when:
        - type: location_lit
      text: "Сложенная вчетверо записка на пожелтевшей бумаге. При свете видны строки, написанные выцветшими чернилами."
    - default: "Сложенная вчетверо записка на пожелтевшей бумаге. В темноте не разобрать ни слова."
  consumable: false

hammer:
  name: "Молоток"
  description: "Увесистый молоток с деревянной ручкой."
  consumable: false

nail:
  name: "Гвоздь"
  description: "Чуть кривоватый гвоздь длиной сантиметров десять."
  consumable: true

pink_key:
  name: "Розовый ключ"
  description: "Маленький ключик, вокруг которого расходится еле заметное розовое сияние."
  consumable: true

needle:
  name: "Иголка"
  description: "Толстая сапожная иголка с широким ушком."
  consumable: false

chisel:
  name: "Стаместка"
  description: "Стаместка с деревянной ручкой. Полотно покрыто ржавчиной, но лезвие остро заточено."
  consumable: false